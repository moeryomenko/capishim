                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the workload cluster's API server
                  endpoint.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              failureMessage:
                description: FailureMessage is a human-readable message for the last
                  failure.
                type: string
              failureReason:
                description: FailureReason is a machine-readable reason for the last
                  failure.
                type: string
              initialization:
                description: |-
                  Initialization provides observations of the HypervisorCluster
                  initialization process.
                  NOTE: this field is part of the Cluster API contract and it is used to
                  orchestrate initial provisioning.
                properties:
                  provisioned:
                    description: |-
                      Provisioned is true when the infrastructure provider reports the object
                      fully provisioned. The value is never updated after provisioning is
                      completed.
                      NOTE: this field is part of the Cluster API contract and it is used to
                      orchestrate provisioning.
                    type: boolean
                type: object
              ready:
                description: |-
                  Ready indicates the host network stack is provisioned and the control
                  plane endpoint is reachable.
                type: boolean
            required:
            - ready
            type: object
        type: object
